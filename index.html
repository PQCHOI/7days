<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THANKS 7DAYS Catalog</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f3;
        color: #222;
    }
    header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(255,255,255,0.94);
        border-bottom: 1px solid #ddd;
        padding: 18px 24px;
        backdrop-filter: blur(8px);
    }
    h1 {
        margin: 0 0 8px;
        font-size: 24px;
    }
    .summary {
        font-size: 14px;
        color: #555;
    }
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 18px;
        padding: 22px;
    }
    .card {
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .image-wrap {
        background: #eee;
        aspect-ratio: 5 / 7;
        overflow: hidden;
    }
    img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    .content {
        padding: 14px;
    }
    h2 {
        font-size: 15px;
        line-height: 1.35;
        min-height: 42px;
        margin: 10px 0;
    }
    .status {
        display: inline-block;
        padding: 4px 9px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: bold;
    }
    .available {
        background: #e8f7e8;
        color: #167a2e;
    }
    .soldout {
        background: #f7e8e8;
        color: #a82222;
    }
    .price {
        font-weight: bold;
        margin: 8px 0 4px;
    }
    .compare {
        color: #777;
        font-size: 13px;
        margin: 0 0 8px;
    }
    .tags {
        color: #777;
        font-size: 11px;
        line-height: 1.35;
        min-height: 32px;
    }
    .button {
        display: block;
        text-align: center;
        margin-top: 12px;
        padding: 9px 10px;
        border-radius: 8px;
        background: #222;
        color: #fff;
        text-decoration: none;
        font-size: 13px;
    }
    footer {
        padding: 24px;
        text-align: center;
        color: #777;
        font-size: 12px;
    }
</style>
</head>
<body>
<header>
    <h1>THANKS 7DAYS Catalog</h1>
    <div class="summary">
        총 상품 0개 / 재고 있음 0개 / 마지막 업데이트 2026-08-10 00:50:33 JST
    </div>
</header>
<main class="grid">
    
</main>
<footer>
    Generated from public products.json
</footer>
</body>
</html>
